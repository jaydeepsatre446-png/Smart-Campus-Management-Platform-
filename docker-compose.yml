version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: smart_campus_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - campus_network

  backend:
    build:
      context: ./smart-campus-backend
      dockerfile: Dockerfile
    container_name: smart_campus_backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/smart_campus
      JWT_SECRET: super_secret_jwt_key_devfusion_2026
      NODE_ENV: production
    depends_on:
      - mongodb
    networks:
      - campus_network

  frontend:
    build:
      context: ./smart-campus-frontend
      dockerfile: Dockerfile
    container_name: smart_campus_frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - campus_network

volumes:
  mongodb_data:

networks:
  campus_network:
    driver: bridge